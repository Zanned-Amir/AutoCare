# Production. Secrets have no default: the app does not start without them.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}

autocare:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    cookie-secure: true
  storage:
    endpoint: ${S3_ENDPOINT}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  web:
    base-url: ${WEB_BASE_URL}
  oauth:
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL}
  sms:
    provider: ${SMS_PROVIDER:twilio}
  telegram:
    mode: ${TELEGRAM_MODE:webhook}

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs
