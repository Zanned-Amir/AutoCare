<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: layout(#{mail.verify-email.title}, #{mail.verify-email.eyebrow}, '✉', ~{::content}, true)}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{mail/fragments :: lead(#{mail.verify-email.greeting(${name})})}"></th:block>
  <th:block th:if="${link != null}">
  <th:block th:replace="~{mail/fragments :: lead(#{mail.verify-email.message-link})}"></th:block>
  <th:block th:replace="~{mail/fragments :: button(${link}, #{mail.verify-email.cta})}"></th:block>
  </th:block>
  <th:block th:if="${code != null}">
  <th:block th:replace="~{mail/fragments :: lead(#{mail.verify-email.message-code})}"></th:block>
  <th:block th:replace="~{mail/fragments :: codeblock(${code})}"></th:block>
  </th:block>
  <th:block th:replace="~{mail/fragments :: fineprint(#{mail.common.validity(${validity})})}"></th:block>
  <th:block th:replace="~{mail/fragments :: fineprint(#{mail.common.ignore})}"></th:block>
</th:block>
</body>
</html>
