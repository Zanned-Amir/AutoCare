<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: layout(#{mail.password-changed.title}, #{mail.password-changed.eyebrow}, '🔒', ~{::content}, true)}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{mail/fragments :: lead(#{mail.password-changed.greeting(${name})})}"></th:block>
  <th:block th:replace="~{mail/fragments :: lead(#{mail.password-changed.message(${date})})}"></th:block>
  <th:block th:replace="~{mail/fragments :: note(#{mail.password-changed.security})}"></th:block>
  <th:block th:replace="~{mail/fragments :: ghostButton(${link}, #{mail.password-changed.cta})}"></th:block>
</th:block>
</body>
</html>
