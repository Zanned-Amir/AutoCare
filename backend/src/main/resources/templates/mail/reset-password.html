<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: layout(#{mail.reset-password.title}, #{mail.reset-password.eyebrow}, '🔑', ~{::content}, true)}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{mail/fragments :: lead(#{mail.reset-password.greeting(${name})})}"></th:block>
  <th:block th:if="${link != null}">
  <th:block th:replace="~{mail/fragments :: lead(#{mail.reset-password.message-link})}"></th:block>
  <th:block th:replace="~{mail/fragments :: button(${link}, #{mail.reset-password.cta})}"></th:block>
  </th:block>
  <th:block th:if="${code != null}">
  <th:block th:replace="~{mail/fragments :: lead(#{mail.reset-password.message-code})}"></th:block>
  <th:block th:replace="~{mail/fragments :: codeblock(${code})}"></th:block>
  </th:block>
  <th:block th:replace="~{mail/fragments :: fineprint(#{mail.common.validity(${validity})})}"></th:block>
  <th:block th:replace="~{mail/fragments :: fineprint(#{mail.reset-password.unchanged})}"></th:block>
</th:block>
</body>
</html>
