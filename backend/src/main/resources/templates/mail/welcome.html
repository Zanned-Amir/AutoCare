<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/layout :: layout(#{mail.welcome.title}, #{mail.welcome.eyebrow}, '🚗', ~{::content}, false)}">
<body>
<th:block th:fragment="content">
  <th:block th:replace="~{mail/fragments :: lead(#{mail.welcome.greeting(${name})})}"></th:block>
  <th:block th:replace="~{mail/fragments :: lead(#{mail.welcome.message})}"></th:block>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:6px 0 10px;text-align:left;font-size:14px;line-height:1.5;color:#141a1e;">
    <tr th:each="step : ${ {'mail.welcome.step1', 'mail.welcome.step2', 'mail.welcome.step3'} }">
      <td style="width:28px;padding:6px 0;vertical-align:top;color:#0b6e79;font-weight:700;">✓</td>
      <td style="padding:6px 0;" th:text="#{${step}}">Step</td>
    </tr>
  </table>
  <th:block th:replace="~{mail/fragments :: button(${link}, #{mail.welcome.cta})}"></th:block>
</th:block>
</body>
</html>
