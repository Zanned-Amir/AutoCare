# Settings shared by every profile. Defaults are for a local machine; application-prod.yaml removes the unsafe ones.
spring:
  application:
    name: autocare-api
  # The same .env as Docker Compose, so `./mvnw spring-boot:run` and the IDE use your values too.
  # Started from backend/ (../.env) or the repo root (.env); real environment variables still win.
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:autocare}
    username: ${POSTGRES_USER:autocare}
    password: ${POSTGRES_PASSWORD:autocare}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # One PostgreSQL schema per module. Flyway creates them and keeps its own history in "public".
  flyway:
    enabled: true
    create-schemas: true
    default-schema: public
    schemas: auth,organization,file,vehicle,catalog,provider,diagnostic,servicerequest,maintenance,notification,marketplace,subscription,billing,review,audit,telegram,helpdesk,apiaccess
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:autocare}
  cache:
    type: redis

  # messages.properties is French (default), messages_en.properties English. Never fall back to the server's locale.
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /docs/openapi
  swagger-ui:
    path: /docs

autocare:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
      issuer: autocare-api
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      # Staff sessions are short: a stolen backoffice cookie stops working the same day.
      backoffice-refresh-token-ttl: 12h
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    cookie-secure: ${COOKIE_SECURE:false}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:autocare}
    secret-key: ${S3_SECRET_KEY:autocare2026}
    bucket: ${S3_BUCKET:autocare}
    path-style-access: true
    signed-url-ttl: 15m
  mail:
    from: ${MAIL_FROM:AutoCare TN <no-reply@autocare.tn>}
    support-email: ${MAIL_SUPPORT:support@autocare.tn}
  oauth:
    # Where providers send users back: {redirect-base-url}/auth/oauth/{provider}/callback.
    # Through the web origin in dev (Angular proxy) so the refresh cookie lands on the web app's origin.
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:4200/api}
    # A provider is enabled when its client-id is set.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Android/iOS client ids also accepted as the audience of mobile ID tokens.
      extra-client-ids: ${GOOGLE_EXTRA_CLIENT_IDS:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    apple:
      # Services id (web) and bundle id (iOS), comma separated: Apple only uses ID tokens here.
      client-ids: ${APPLE_CLIENT_IDS:}
  sms:
    # log: print SMS in the API log (dev). twilio: send through Twilio (set the three values below).
    provider: ${SMS_PROVIDER:log}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  telegram:
    # Empty token = Telegram disabled. mode: polling (dev, no public URL) or webhook (prod).
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    mode: ${TELEGRAM_MODE:polling}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  web:
    # Frontend origin used in e-mail links (verify e-mail, reset password).
    base-url: ${WEB_BASE_URL:http://localhost:4200}

